name: Game feedback
description: Tell us what worked or what could make Quick Rummy more fun
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Feedback type
      options:
        - Gameplay suggestion
        - Visual design
        - Mobile or desktop usability
        - Bug report
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      description: Please do not include personal, payment, or account information.
      placeholder: Describe what happened or what would improve the game.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device used
      options:
        - Android
        - iPhone or iPad
        - Windows PC
        - Mac
        - Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (for a bug)
      description: Optional, especially useful if you report an issue.
