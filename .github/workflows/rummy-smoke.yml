name: Rummy static smoke checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: node tests/gameplay.cjs
      - run: node tests/turn-flow.cjs
      - run: node tests/youtube-sdk.cjs
